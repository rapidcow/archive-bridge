// Reverse-engineered schema for the pre-Coherence Apple Notes PencilKit
// drawing blob (UTI "com.apple.drawing.2"), found in
// ZICCLOUDSYNCINGOBJECT.ZMERGEABLEDATA1 of NoteStore.sqlite.
//
// This is not a published Apple .proto - it was inferred by running
// `protoc --decode_raw` against a real drawing blob (skipping an 8-byte
// envelope of unconfirmed purpose) and matching field shapes to known
// PencilKit concepts. Only Drawing.ink_defs and the X/Y geometry inside
// Stroke.geometry.points are decoded with confidence; everything else
// (StrokeSeqInfo.ink_category, IndexEntry, BBox field order, Geometry's
// unk2/unk4/unk5/unk6, and the >8-byte tail of each point record) is
// exposed by the decoder as raw numbers/hex without a confirmed meaning.

syntax = "proto2";

message RGBA {
  optional float r = 1;
  optional float g = 2;
  optional float b = 3;
  optional float a = 4;
}

message InkDef {
  optional RGBA rgba   = 1;
  optional string name = 2;  // e.g. "com.apple.ink.pen"
  optional int32 weight = 3; // tool weight/width class, units unconfirmed
}

// Shape shared by the top-level index table (field 3) and a per-stroke
// sub-table (field 3 inside Stroke) - meaning of f1/f2/f3 unconfirmed.
message IndexEntry {
  optional int32 f1 = 1;
  optional int32 f2 = 2;
  optional int32 f3 = 3;
}

message StrokeSeqInfo {
  optional int32 seq          = 1; // per-stroke sequence id (near-unique)
  optional int32 ink_category = 2; // observed values 2/3/4; NOT a direct
                                    // index into Drawing.ink_defs - the
                                    // mapping to a specific ink_def is
                                    // unconfirmed.
  optional int32 f3           = 3;
}

message BBox {
  optional float f1 = 1; // observed as x in samples - order unconfirmed
  optional float f2 = 2; // observed as y
  optional float f3 = 3; // observed as w
  optional float f4 = 4; // observed as h
}

message Geometry {
  optional bytes uuid    = 1;
  optional fixed64 unk2  = 2; // unconfirmed; looked timestamp-ish
  optional int32 npts    = 3; // point count
  optional int32 unk4    = 4;
  optional int32 unk5    = 5;
  optional bytes unk6    = 6; // short (~6 byte) blob, unconfirmed
  // Flat point table, length = npts * stride. Stride varies per stroke
  // (observed: 12,14,16,18,20,22). The first 8 bytes of every point are
  // little-endian float32 X, float32 Y (confirmed). Remaining
  // (stride-8) bytes are believed to hold packed/quantized auxiliary
  // channels (force/azimuth/altitude/time) - NOT decoded here, and not
  // expressible as a protobuf field since the stride is implicit, not
  // itself a wire-format construct.
  optional bytes points  = 7;
}

message Stroke {
  optional bytes uuid           = 1;
  optional StrokeSeqInfo seq_info = 2;
  optional IndexEntry sub_index = 3;
  optional int32 f4              = 4;
  optional Geometry geometry     = 5; // absent for empty/zero-point strokes
  optional BBox bbox             = 6;
  optional int32 f8               = 8;
}

message Drawing {
  repeated bytes uuids      = 2; // 16-byte UUIDs, use unidentified
  repeated IndexEntry index = 3;
  repeated InkDef ink_defs  = 4;
  repeated Stroke strokes   = 5;
}
