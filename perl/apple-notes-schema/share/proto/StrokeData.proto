//;;
//;; StrokeData.proto - common Apple Notes ink markup stroke data
//;;
//;; Distilled version of `ai/tools/apple-notes-drawing-2.proto'.
//;;

package rd_kw.apple.notes.schema;

syntax = "proto2";

message StrokeData {
  // strokeDataUUID - plausibly what PencilKit's ObjC bridge calls
  // -[_PKStrokeConcrete _strokeDataUUID]/-[PKStrokePath_strokeDataUUID].
  // Compare with Stroke.strokeUUID.
  optional bytes stroke_data_uuid = 1;

  // timestamp - an 8-byte fixed64/double, read directly (no varint decode).
  optional double timestamp = 2;

  // pointsCount - point count.
  optional int32 points_count = 3;

  // pointsFlags - PencilKit's per-point channel presence bitmask,
  // PKStrokePathPointsShared::pointFlags().  Bit 0 (0x1) appears
  // to be always set.
  optional int32 points_flags = 4;

  // pointsConstantFlags - a varint-decoded int32/bitmask.
  optional int32 points_constant_flags = 5;

  // pointsConstantValues - short (~6-10 byte) blob; appears to
  // always start with bytes "e8 03 00 00" (uint32 1000) and end
  // with "ff 7f" (uint16 0x7fff/32767).
  optional bytes points_constant_values = 6;

  // pointsData - flat point table, length = points_count * stride.
  // Stride varies per stroke (observed: 12,14,16,18,20,22).  The
  // first 8 bytes of every point are little-endian float32 X,
  // float32 Y.  The remaining (stride-8) bytes are the channels
  // gated by `points_flags`, packed tightly in increasing channel-
  // index order (see the table above).  This requires specialized
  // routine to decode further.
  optional bytes points_data = 7;

  // createdWithFinger - a single raw byte, decoded as a plain 0/1 bool.
  optional bool created_with_finger = 8;

  // immutablePointsCount - varint int32.
  optional int32 immutable_points_count = 9;

  // startIndex - varint int32.
  optional int32 start_index = 10;
}
